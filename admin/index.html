<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>おしぽすと 統計</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, sans-serif; background: #fff0f5; color: #333; padding: 20px; }
  h1 { color: #e91e8c; text-align: center; margin-bottom: 20px; font-size: 22px; }
  .card { background: white; border-radius: 15px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(233,30,140,0.1); }
  .card h2 { color: #e91e8c; font-size: 15px; margin-bottom: 12px; }
  .stat-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #fce4ec; }
  .stat-row:last-child { border-bottom: none; }
  .stat-name { font-size: 14px; }
  .stat-count { background: #e91e8c; color: white; border-radius: 20px; padding: 2px 10px; font-size: 13px; font-weight: bold; }
  .total { text-align: center; font-size: 36px; font-weight: bold; color: #e91e8c; }
  .total-label { text-align: center; font-size: 13px; color: #999; margin-top: 4px; }
  .loading { text-align: center; color: #999; padding: 40px; }
  .updated { text-align: center; font-size: 11px; color: #bbb; margin-top: 8px; }
</style>
</head>
<body>
<h1>🩷 おしぽすと 統計</h1>
<div id="app"><div class="loading">読み込み中...</div></div>
<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzdvlKcL0Rxph8Cs3elVL5yJF2MNhxY0Vnbnt_VSu094GJqd2H8TRxoAAqM3TXbQVF-/exec';

async function load() {
  try {
    const res = await fetch(GAS_URL + '?action=stats');
    const json = await res.json();
    if (json.status !== 'ok') throw new Error();
    render(json.data);
  } catch(e) {
    document.getElementById('app').innerHTML = '<div class="loading">データ取得に失敗しました</div>';
  }
}

function rank(data, key) {
  const count = {};
  data.forEach(d => {
    const val = d[key] || '不明';
    count[val] = (count[val] || 0) + 1;
  });
  return Object.entries(count).sort((a,b) => b[1]-a[1]);
}

function render(data) {
  const total = data.length;
  const groups = rank(data, 'groupName');
  const tags = rank(data, 'tags');
  const now = new Date().toLocaleString('ja-JP');

  let html = `
    <div class="card">
      <div class="total">${total}</div>
      <div class="total-label">総投稿数</div>
    </div>
    <div class="card">
      <h2>🏆 グループランキング</h2>
      ${groups.map(([name, count]) => `
        <div class="stat-row">
          <span class="stat-name">${name}</span>
          <span class="stat-count">${count}</span>
        </div>`).join('')}
    </div>
    <div class="card">
      <h2>#️⃣ タグランキング</h2>
      ${tags.map(([tag, count]) => `
        <div class="stat-row">
          <span class="stat-name">${tag}</span>
          <span class="stat-count">${count}</span>
        </div>`).join('')}
    </div>
    <div class="updated">最終更新: ${now}</div>
  `;
  document.getElementById('app').innerHTML = html;
}

load();
</script>
</body>
</html>
